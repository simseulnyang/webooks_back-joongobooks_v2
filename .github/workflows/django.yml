name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key-for-ci
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      KAKAO_REST_API_KEY: test_kakao_key
      KAKAO_CLIENT_SECRET: test_kakao_secret
      KAKAO_REDIRECT_URI: http://localhost:8000/api/users/kakao/callback/
      GOOGLE_CLIENT_ID: test_google_id
      GOOGLE_CLIENT_SECRET: test_google_secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/api/users/google/login/callback/

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install Poetry
      uses: snok/install-poetry@v1

    - name: 📦 Install dependencies
      run: poetry install --no-interaction --with dev

    - name: 📊 Run migrations
      run: |
        poetry run python manage.py makemigrations --check --dry-run
        poetry run python manage.py migrate

    - name: 🧪 Run tests
      run: poetry run python manage.py test

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Black (check)
        run: poetry run black --check --line-length=120 .

      - name: Flake8 (with config)
        run: |
          test -f .flake8
          poetry run flake8 . --config=.flake8 --show-source --statistics